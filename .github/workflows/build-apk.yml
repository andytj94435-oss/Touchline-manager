
name: Build Touchline Manager APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack Android project
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          unzip Touchline_Manager_Android_Cloud_Build.zip -d unpacked

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      

      - name: Build APK
        run: |
          cd unpacked/touchline_manager_android
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: touchline-manager-debug-apk
          path: unpacked/touchline_manager_android/app/build/outputs/apk/debug/app-debug.apk

